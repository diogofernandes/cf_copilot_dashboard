services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DEMO_MODE: "1"
      EMAIL_PROVIDER: local_rules
    volumes:
      - demo_artifacts:/app/raw_data/demo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      start_period: 90s
      timeout: 5s
      retries: 5
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
volumes:
  demo_artifacts:
